<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f4"><meta name="description" content="Your personal flavour inventory and mixing notebook"><link rel="manifest" href="./manifest.webmanifest"><title>Flavour Lab</title><style>html{background:#fff8f4;color:#473640}html[data-theme=dark]{background:#211c26;color:#f5eaf1}</style><script>try{var mode=localStorage.getItem('flavour-lab-theme');if(mode!=='light'&&mode!=='dark')mode=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=mode;document.documentElement.style.colorScheme=mode;document.querySelector('meta[name="theme-color"]').content=mode==='dark'?'#211c26':'#fff8f4';}catch{}</script></head><body><div id="app"><section id="startup" style="font-family:system-ui;max-width:32rem;margin:15vh auto;padding:2rem;color:inherit"><h1>Flavour Lab</h1><p id="startup-message">Loading your mixing space…</p><button onclick="location.reload()" style="padding:.8rem 1.2rem;cursor:pointer">Reload app</button></section></div><script>window.addEventListener('error',function(){var el=document.getElementById('startup-message');if(el)el.textContent='The app could not load. Please reload this page. Your saved data has not been changed.';});setTimeout(function(){var el=document.getElementById('startup-message');if(el)el.textContent='Loading is taking longer than expected. Check your connection and reload.';},12000);</script><script type="module" src="/src/main.js"></script></body></html>
